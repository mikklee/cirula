[package]
name = "sirula"
version = "2.0.0"
authors = ["Dorian Rudolph", "Jan Luca"]
edition = "2021"

[dependencies]
# UI Framework
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
iced_layershell = "0.14"
iced_font_awesome = "0.4"

# Async runtime
tokio = { version = "1", features = ["rt", "sync"] }

# App discovery
freedesktop_entry_parser = "2.0"

# Search
fuzzy-matcher = "0.3"
regex = "1.12"

# Config and serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Utilities
xdg = "3.0"
shlex = "1.3"
libc = "0.2"
locale-types = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strum = { version = "0.27", features = ["derive"] }

[profile.release]
lto = true
